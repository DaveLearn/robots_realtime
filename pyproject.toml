[build-system]
requires = ["flit_core >= 3.4"]
build-backend = "flit_core.buildapi"

[project]
name = "robots_realtime"
version = "0.1.0"
description = "A collection of realtime & high-frequency control interfaces for robot arms"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "viser",
    "tyro>=1.0.1",
    "omegaconf",
    "portal",
    "dm-env==1.6",
    "dm_control==1.0.30",
    "dotdict==0.1",
    "numpy>=2.0",
    "opencv-python",
    "robot_descriptions",
    "yourdfpy",
    "ruff",
    # jaxls comes in transitively from pyroki, which requires it by unpinned git
    # URL. We don't restate it here: pixi has no uv-style dependency overrides,
    # so a second, pinned URL for the same package is a hard resolver conflict.
    # pixi.lock pins the resolved jaxls commit instead.
    "pyroki @ git+https://github.com/chungmin99/pyroki.git@59aa21f",
    "matplotlib",
    # AsyncMp4Writer records through imageio's FFMPEG plugin, which needs the
    # imageio-ffmpeg wheel, which ships its own static ffmpeg (conda's ffmpeg
    # would work too, but it drags in libva -> a second copy of libglvnd).
    "imageio",
    "imageio-ffmpeg",
    "msgpack",
    "msgpack_numpy",
    # robots_realtime.policy_client (vendored openpi websocket client) needs these.
    "websockets>=11.0",
    "pillow>=9.0",
    "minimalmodbus",
    "uvicorn",
    "fastapi",
    "xdof_sdk",
    "gymnasium>=0.29",
    "pyzmq>=27.1.0",
    "python-can>=4.3.0",
    "mcap>=1.3.1",
    "mcap-protobuf-support>=0.5.4",
    "protobuf>=6.33.1",
]

[project.scripts]
rr-session = "robots_realtime.rr_session_cli:main"
rr-replay  = "robots_realtime.rr_replay_cli:main"

[project.optional-dependencies]
realsense = [
    "pyrealsense2>=2.55",
]
mjlab_sim = [
    "mjlab",
]
sim = [
    "gymnasium>=0.29",
]

# ── pixi ──────────────────────────────────────────────────────────────────────
# Conventions used below:
#   * [tool.pixi.dependencies] holds conda packages only — the C/native
#     libraries you would otherwise apt install.
#   * everything Python lives in [project.dependencies] / the pypi tables.
#   * extras declared in [project.optional-dependencies] become pixi features
#     of the same name automatically; features for local wheels are defined
#     explicitly here because those aren't resolvable from PyPI.

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.dependencies]
python = "3.11.*"
# OpenGL from conda, so libGL.so.1 is ABI-consistent with everything else conda
# built. Note what this does and doesn't provide: libglvnd is the *dispatch*
# layer, and it still dlopens the machine's own driver vendor library
# (libGLX_nvidia.so.0 etc.) at context creation, chosen by asking the X server.
# So conda dispatch + host vendor is the intended, working combination — but the
# host half has to be there and match the running kernel driver. `pixi run
# gl-check` prints which vendor actually got loaded.
libgl-devel = "*"
libegl-devel = "*"
libglu = "*"
# A few PyPI deps ship sdists only (e.g. pyliblzfse) and need a C toolchain
# at install time — pixi environments don't see the system compiler.
c-compiler = "*"

# Make MuJoCo load GL through EGL rather than GLX.
#
# MuJoCo resolves GL entry points with glad. On the GLX path that fails on some
# machines — the context is created fine and plain GL calls work, but glad comes
# back with `gladLoadGL error`, the viewer window appears and vanishes, and
# because it exits from C there is nothing in the node's Python log. The EGL
# loader talks to the same NVIDIA driver and the same on-screen context, and
# works on every machine we have tried, so it is the safer default. It is also
# the better backend for headless offscreen camera rendering.
#
# Override per-run with `MUJOCO_GL=glfw` if a machine ever needs the GLX path.
# `pixi run gl-check --subprocess` compares the backends.
[tool.pixi.activation.env]
MUJOCO_GL = "egl"

[tool.pixi.pypi-dependencies]
robots_realtime = { path = ".", editable = true }

# panda_py / libfranka 0.10.0 for the Franka Panda — a local wheel, so it gets
# its own feature rather than an entry in [project.optional-dependencies].
[tool.pixi.feature.franka_panda.pypi-dependencies]
panda_python = { path = "dependencies/panda_py_0.7.5_libfranka_0.10.0/panda_python-0.7.5+libfranka.0.10.0-cp311-cp311-manylinux_2_17_x86_64.manylinux2014_x86_64.whl" }

# ZED SDK python bindings — local wheel, matched to the installed ZED SDK 5.1.
# Kept out of the default environment because importing it requires the ZED SDK
# itself to be installed on the machine.
[tool.pixi.feature.sensors.pypi-dependencies]
pyzed = { path = "dependencies/pyzed-5.1-cp311-cp311-linux_x86_64.whl" }

[tool.pixi.environments]
# Franka is the hardware we actually run, so it's in the default environment.
default = { features = ["franka_panda", "sim", "realsense"], solve-group = "main" }
sensors = { features = ["franka_panda", "sim", "realsense", "sensors"], solve-group = "main" }
mjlab = { features = ["franka_panda", "sim", "mjlab_sim"] }

[tool.pixi.tasks]
session = "rr-session"
replay = "rr-replay"
lint = "ruff check ."
# Prints the resolved GL dispatch/vendor pair — first thing to run when the
# MuJoCo viewer window flashes and disappears.
gl-check = "python scripts/gl_check.py"
fmt = "ruff format ."

[tool.setuptools.packages.find]
where = ["."]
include = ["robots_realtime*"]
exclude = ["configs*"]

[project.urls]
Repository = "https://github.com/uynitsuj/robots_realtime"

[tool.flit.module]
name = "robots_realtime"

[tool.ruff]
line-length = 119 # Set the max line length to 119 characters.
# keep in alphabetical order
lint.select = [
    "ANN",  # annotations
    "B",  # bugbear rules
    "E",  # pycodestyle errors.
    "F",  # Pyflakes rules.
    "PLC",  # Pylint convention warnings.
    "PLE",  # Pylint errors.
    "PLR",  # Pylint refactor recommendations.
    "PLW",  # Pylint warnings.
    "I",  # Import sorting.
    "RUF"  # Ruff rules.
]
# keep in alphabetical/numerical order
lint.ignore = [
    "ANN002",
    "ANN003",
    "ANN401",  # Dynamically typed expressions (typing.Any) are disallowed
    "E402",
    "E501",
    "E741", # Ambiguous variable name. (l, O, or I)
    "F405",
    "F841",
    "PLC0414",  # Import alias does not rename variable. (this is used for exporting names)
    "PLC1901",  # Use falsey strings.
    "PLR0911",  # Too many return statements.
    "PLR0912",  # Too many branches.
    "PLR0913",  # Too many arguments.
    "PLR0915",  # Too many statements.
    "PLR1722",
    "PLR2004",  # Magic value used in comparison.
    "PLW0603",  # Global statement updates are discouraged.
    "PLW2901",  # For loop variable overwritten.
    "RUF001",
    "RUF009"
]
lint.extend-select = ["E501"]
# policy_client is vendored verbatim from openpi-client; keep it lint-clean of
# our rules so re-syncing with upstream stays a clean diff.
exclude = ["*.ipynb", "dependencies/*", "robots_realtime/policy_client/*"]

[tool.ruff.format]
docstring-code-format = true
skip-magic-trailing-comma = false

[tool.pyright]
pythonVersion = "3.11"
ignore = ["dependencies/**", "robots_realtime/scripts/**"]

reportMissingImports = "none"
reportAttributeAccessIssue = "none"

[tool.coverage.report]
exclude_also = [
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
    "def __repr__",
]
omit = [
    "*exceptions.py",
]

[dependency-groups]
dev = [
    "ruff>=0.12.3",
]

[tool.ruff.lint.flake8-annotations]
ignore-fully-untyped = true
suppress-none-returning = true
suppress-dummy-args = true
mypy-init-return = true
allow-star-arg-any = true
