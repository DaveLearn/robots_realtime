# Single Panda, no hardware: drag the Viser gizmo, PyRoKi solves IK, and the
# URDF view updates from the simulated robot's echoed joint state.
#
#   pixi run rr-session configs/franka/franka_sim_viser_teleop.yaml
#
# Then open http://localhost:8765
version: "1"

session:
  save_root: recordings

nodes:
  - type: ViserTeleopNode
    name: franka_viser
    agent_class: robots_realtime.agents.teleoperation.franka_pyroki_viser_agent:FrankaPyrokiViserAgent
    agent_kwargs:
      viser_port: 8765
      ik_rate: 100.0
      visualize_rgbd: false
    arm_key: left
    ik_freq: 100.0
    viz_freq: 20.0
    state_topics:
      left: franka/joint_state       # "left" so _extract_joint_pos finds it

  - type: RobotNode
    name: franka
    robot_config: robot_configs/franka/franka_sim_kinematic.yaml
    cmd_topic: franka_viser/joint_pos
    # RobotNode's default parking pose is the 7-DOF zero vector; this robot is
    # 8-DOF (arm + gripper), and there's nothing to park in sim anyway.
    shutdown_joint_pos: null
