# Block-stacking demo collection: FPS-style mouse+keyboard teleop of a Panda in
# the control_sufficient_physics MuJoCo sim.
#
#   pixi run rr-session configs/franka/stacking_remote_sim_teleop.yaml
#
# The sim runs as a separate process in its own pixi environment (launched by
# RemoteSimNode via launch_cmd); nothing here imports it. Drop launch_cmd to
# attach to a sim server you started by hand.
#
# Episode flow (in the teleop window): N new scene -> R start -> stack -> R stop.
# Discard the current episode with `d` in this terminal's TUI.
version: "1"

session:
  save_root: recordings/stacking
  record_topic: teleop/record

nodes:
  - type: robots_realtime.runtime.sim.remote_sim_node:RemoteSimNode
    name: sim
    endpoint: tcp://127.0.0.1:5600
    launch_cmd: "pixi run --manifest-path ../../control_sufficient_physics/pyproject.toml sim-server --preset easy --port 5600"
    cmd_topic: teleop/joint_target
    reset_topic: teleop/reset

  - type: robots_realtime.agents.teleoperation.fps_teleop_node:FpsTeleopNode
    name: teleop
    state_topic: sim/state
    image_topics: [sim/wrist_rgb, sim/third_person_rgb]
